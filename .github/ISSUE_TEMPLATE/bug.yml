name: Report a defect
description: Something in the installer, the lint, or a skill is wrong.
labels: ["defect"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - installer (install, update, uninstall, doctor)
        - lint
        - grounding check
        - a skill's content
        - a grounding matrix cites the wrong rule
        - documentation
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Give the exact command and the exact output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version`, and how you installed stylewright.

  - type: markdown
    attributes:
      value: |
        **A wrong rule identifier in a grounding matrix is a real defect.**
        Give the skill name, the row ID, the rule we cite, and the rule you
        believe is correct. Say where you checked.
