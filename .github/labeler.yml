# Labels a pull request from the paths that it touches.
#
# A pull request can take several labels, and overlap is fine. `src/lint.js`
# earns both `engine` and `lint`, and both are true.
#
# Do NOT use a `!` pattern inside `any-glob-to-any-file`. It reads as "any file
# that does not match this", so it matches nearly every changed file and the
# label lands on everything. Narrow the positive globs instead. This is why
# `documentation` matches `*.md` at the root rather than `**/*.md`, which would
# also catch every SKILL.md and every grounding matrix.

engine:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'bin/**'

lint:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/lint.js'
          - 'src/markdown.js'
          - 'test/lint.test.js'

grounding:
  - changed-files:
      - any-glob-to-any-file:
          - 'grounding/**'
          - 'src/ground.js'
          - 'test/ground.test.js'

skill content:
  - changed-files:
      - any-glob-to-any-file:
          - 'skills/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**'
          - '.github/ISSUE_TEMPLATE/**'

distribution:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'package.json'
          - 'package-lock.json'
          - 'scripts/**'

# `new skill` is deliberately absent. The labeler sees changed paths and not
# added ones, so any rule for it would fire on every edit to an existing skill.
# The skill issue form applies that label, and triage applies it to a pull
# request.
