name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the versions we ADVERTISE, not the newest of each major.
        # `engines` says >=20.11.0, so 20.11.0 and 22.0.0 are both versions a
        # user may legitimately run. Writing '20' here resolves to the newest
        # Node 20, which hides any dependency that needs more than our floor.
        node: ['20.11.0', '22.0.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: Unit and conformance tests
        run: npm test

      # The repository checks its own documentation with its own tool.
      - name: Lint the documentation
        run: npm run lint:docs

      # Fails when a skill changes and its grounding matrix does not.
      - name: Check every grounding matrix
        run: npm run check:ground

      # Fails when a document's front matter does not fit the schema.
      - name: Check every document's front matter
        run: npm run check:docs

      # Fails when a probe record is malformed, states its own outcome, or was
      # collected under any flags but the control arm's.
      - name: Check every probe record
        run: npm run check:probes

  # Windows support is a claim, and a claim nothing runs stops being true
  # quietly. This job is separate from `check` rather than an `os` dimension on
  # its matrix, because adding a dimension renames every existing job and the
  # branch ruleset requires those names.
  windows:
    runs-on: windows-latest
    strategy:
      # A failure at one end of the range says nothing about the other, and
      # cancelling the second version hides half of what a Windows run knows.
      fail-fast: false
      matrix:
        # Both ends of the supported range, because Node's own behaviour moves
        # inside it: a release above the floor began refusing to spawn a `.cmd`
        # without a shell, and `npm` is `npm.cmd` here. One version would test
        # one side of that refusal.
        node: ['20.11.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # `npm run check` is the same set of checks the ubuntu job runs as named
      # steps. None of them shells out, so nothing here needs zsh.
      # `bench/run.sh` does, and CI never invokes the runner.
      - name: Every check
        run: npm run check
