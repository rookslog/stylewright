name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the versions we ADVERTISE, not the newest of each major.
        # `engines` says >=20.11.0, so 20.11.0 and 22.0.0 are both versions a
        # user may legitimately run. Writing '20' here resolves to the newest
        # Node 20, which hides any dependency that needs more than our floor.
        node: ['20.11.0', '22.0.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: Unit and conformance tests
        run: npm test

      # The repository checks its own documentation with its own tool.
      - name: Lint the documentation
        run: npm run lint:docs

      # Fails when a skill changes and its grounding matrix does not.
      - name: Check every grounding matrix
        run: npm run check:ground
