# Publishes to npm and opens a GitHub Release when you push a `v*` tag.
#
# There is no npm token. The `publish` job authenticates to npm over OIDC, as a
# trusted publisher. Configure the other half of that trust on npmjs.com, under
# the package settings, and name this file there as `release.yml`.
#
# Each job holds the smallest permission set that it needs. Only `publish` can
# mint an OIDC token, and only `release` can write to the repository.
name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # Never publish an unchecked build. This repeats the CI matrix, because a tag
  # can point at a commit that CI never saw.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Same set as ci.yml. See the comment there.
        node: ['20.11.0', '22.0.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # A tag and a version that disagree would publish the wrong number, and npm
  # accepts no correction after the fact. Fail before anything is published.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  # A release run that publishes nothing must not be green. The v0.1.0 run was
  # green on every job and published nothing: the version had been pushed to the
  # registry by hand beforehand, so the publish step skipped, and its skip read
  # as success. The OIDC path it exists to exercise has still never run.
  #
  # This refuses, and there is no way to accept. Two review rounds went into an
  # escape hatch — attempt one refuses, attempt two accepts — and it was wrong
  # both times in the same way. `run_attempt` counts attempts. It does not
  # record that anybody saw the refusal, so ANY failure before the refusal is
  # reached spends attempt one and leaves attempt two accepting a refusal that
  # was never printed. Moving the check earlier narrows that window and cannot
  # close it, because a counter is not evidence of a step.
  #
  # With no acknowledgement mechanism there is nothing to spoof, and the branch
  # that reported a non-event as success is gone rather than guarded. A version
  # already on the registry needs no publish, and a GitHub Release for it is one
  # command by hand. That is the deliberate act, and it leaves its own record.
  #
  # It reads the version from the tag rather than from `guard`, so that nothing
  # stands between the tag and this refusal. `guard` still asserts that the tag
  # and package.json agree, and fails the run before `publish` needs either.
  precheck:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "stylewright@$version" version >/dev/null 2>&1; then
            echo "::error::stylewright@$version is already on the registry, so this tag cannot publish it and this run must not report that it did. If that version is correct and you only need the GitHub Release, create it by hand with gh release create."
            exit 1
          fi

  publish:
    needs: [verify, guard, precheck]
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token that npm trades for publish rights.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or
          # later. Node 24 satisfies both.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci

      # No NODE_AUTH_TOKEN. npm reads the OIDC token and attaches a provenance
      # attestation on its own, so `--provenance` is not passed here.
      # Unconditional. `precheck` has already failed the run if this version is
      # on the registry, so there is no case left in which this step should be
      # skipped, and no condition here that could skip it by accident.
      - run: npm publish

      # Assert the postcondition, rather than the absence of an error. A job
      # that reports what did NOT happen is the failure this step prevents.
      - name: Say what this run actually did
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # Retry before calling a completed upload absent. This step runs after
          # an irreversible action, the registry read can lag the write, and a
          # false negative here fails the job and takes the GitHub Release for a
          # version that did ship. A hard postcondition belongs after the lag,
          # not inside it.
          for attempt in 1 2 3 4 5 6; do
            if npm view "stylewright@$VERSION" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::stylewright@$VERSION is not on the registry 75 seconds after npm publish reported success."
              exit 1
            fi
            sleep 15
          done
          echo "Published \`stylewright@$VERSION\` from this run." >> "$GITHUB_STEP_SUMMARY"
          # Trusted publishing attaches provenance. Its absence means npm
          # accepted the upload by some other route, which is worth saying out
          # loud and is not worth failing a completed publish over.
          #
          # Read the JSON, not the human-readable form. `npm view <field>`
          # renders any non-string through `util.inspect` (npm 11.17.0,
          # lib/commands/view.js:222), so an explicit null prints the
          # four-character string `null` and an emptiness test on it reports
          # provenance that is not there. npm marks that output path
          # `TODO(BREAKING_CHANGE)` besides. Absent and null are both absent.
          # This report runs AFTER an irreversible upload, so it must not be
          # able to fail the job. A lookup that errors is tolerated explicitly
          # rather than by whichever shell template happens to apply: the
          # default is `bash -e {0}` and carries no pipefail, so the pipeline
          # takes node's exit status today, but `shell: bash` or a
          # `defaults.run.shell` anywhere adds `-o pipefail` and would make a
          # transient registry error abort the step and skip the release.
          #
          # A failed lookup is reported as unknown and not as absent. Saying
          # "no attestation" when we did not manage to look is the same class
          # of false statement this workflow exists to stop making.
          if raw="$(npm view "stylewright@$VERSION" --json 2>/dev/null)"; then
            attested="$(printf '%s' "$raw" | node -pe '
              let d = null;
              try { d = JSON.parse(require("fs").readFileSync(0, "utf8")); } catch {}
              const v = Array.isArray(d) ? d[d.length - 1] : d;
              v && v.dist && v.dist.attestations ? "yes" : ""
            ')" || attested=''
            if [ -z "$attested" ]; then
              echo "::warning::Published without a provenance attestation. Trusted publishing may not be in effect."
              echo "No provenance attestation. Trusted publishing may not be in effect." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Provenance attestation present, so the OIDC trusted-publishing path ran." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Could not read registry metadata, so provenance is unknown. The publish itself succeeded."
            echo "Provenance unknown. The registry metadata could not be read." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: [publish, guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Reads the hand written section out of CHANGELOG.md. The script exits
      # non-zero when that section is absent or empty.
      - run: node scripts/release-notes.mjs "$VERSION" > release-notes.md
        env:
          VERSION: ${{ needs.guard.outputs.version }}
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
